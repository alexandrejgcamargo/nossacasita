.cc, .cc * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
.cc-fundo { background: ${b.suave}; min-height: 100%; }
.cc {
  font-family: -apple-system, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI",
               "Avenir Next", Inter, system-ui, "Helvetica Neue", Arial, sans-serif;
  color: ${b.tinta}; background: ${b.papel};
  width: 100%; max-width: 460px; margin: 0 auto; min-height: 100vh;
  position: relative;
  padding-bottom: calc(112px + env(safe-area-inset-bottom, 0px));
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
@media (min-width: 620px) {
  .cc-fundo { padding: 28px 0 0; }
  .cc { border-radius: 22px; box-shadow: 0 10px 40px rgba(11,59,65,.12); overflow: hidden; min-height: calc(100vh - 28px); border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
}
/* :where() zera a for\xE7a desta regra. Antes ela vencia as classes dos bot\xF5es
   e apagava cor, borda e respiro de .tile, .b-lancar, .chip, .b-forte e .b-fraco. */
.cc :where(button) { font-family: inherit; cursor: pointer; border: 0; background: none; color: inherit; padding: 0; }
.cc :where(input) { font-family: inherit; }
.cc button:focus-visible, .cc input:focus-visible { outline: 3px solid ${b.acento}; outline-offset: 2px; border-radius: 8px; }
.n { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }

.t-xl   { font-size: 48px; font-weight: 800; letter-spacing: -.035em; line-height: 1.02; }
.t-tela { font-size: 23px; font-weight: 750; letter-spacing: -.02em; }
.t-num  { font-size: 24px; font-weight: 750; letter-spacing: -.015em; }
.t-item { font-size: 17px; font-weight: 600; letter-spacing: -.005em; }
.t-rot  { font-size: 14.5px; font-weight: 650; color: ${b.tinta2}; letter-spacing: .01em; }
.t-mini { font-size: 13px; font-weight: 550; color: ${b.tinta2}; }

.topo { padding: 16px 20px 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 60px; }
.corpo { padding: 0 20px; }
.divisor { border-bottom: 1px solid ${b.linha}; }
.toque { min-width: 44px; min-height: 44px; display: inline-flex; align-items: center; justify-content: center;
  border-radius: 12px; border: 1px solid ${b.linha}; background: ${b.papel};
  transition: transform .09s ease, background .12s ease; }
.toque:active { background: ${b.suave}; transform: scale(.92); }

/* Linha de lista que abre a edi\xE7\xE3o: precisa parecer toc\xE1vel, n\xE3o texto solto. */
.linha-toque { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
  padding: 10px 12px; border-radius: 14px; background: ${b.papel};
  border: 1px solid ${b.linha}; box-shadow: 0 1px 0 ${b.linha};
  transition: transform .09s ease, background .12s ease; }
.linha-toque:active { background: ${b.suave}; transform: scale(.99); }
.linha-toque .seta { color: #9FB9BF; flex-shrink: 0; }

/* Rodap\xE9 preso na tela: os tr\xEAs bot\xF5es ficam sempre \xE0 m\xE3o, sem rolar.
   touch-action tira o atraso do toque duplo; pointer-events nos filhos faz o
   toque no \xEDcone contar como toque no bot\xE3o. */
.nav { position: fixed; left: 0; right: 0; bottom: 0; margin: 0 auto; max-width: 460px; z-index: 25;
  padding: 8px 10px calc(8px + env(safe-area-inset-bottom, 0px));
  background: rgba(255,255,255,.94); -webkit-backdrop-filter: saturate(1.6) blur(14px); backdrop-filter: saturate(1.6) blur(14px);
  border-top: 1px solid ${b.linha}; box-shadow: 0 -8px 24px rgba(11,59,65,.10);
  display: grid; grid-template-columns: repeat(3,1fr); gap: 6px; }
@media (min-width: 620px) { .nav { border-radius: 22px 22px 0 0; border-left: 1px solid ${b.linha}; border-right: 1px solid ${b.linha}; } }
.nav button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  min-height: 66px; padding: 6px 4px; border-radius: 18px;
  font-size: 13.5px; font-weight: 700; color: ${b.tinta2}; letter-spacing: .005em;
  touch-action: manipulation; user-select: none; -webkit-user-select: none;
  transition: transform .1s ease, background .15s ease, color .15s ease; }
.nav button * { pointer-events: none; }
.nav button:active { transform: scale(.94); background: ${b.suave}; }
.nav button .bolha { display: flex; align-items: center; justify-content: center;
  width: 60px; height: 36px; border-radius: 999px; transition: background .18s ease, color .18s ease, transform .18s ease; }
.nav button[data-on="1"] { color: ${b.acento}; font-weight: 800; }
.nav button[data-on="1"] .bolha { background: ${b.acento}; color: #fff; box-shadow: 0 4px 12px rgba(0,109,119,.32); }

/* Gasto ou receita, \xE0 vista ou parcelado: chave de duas posi\xE7\xF5es. */
.seg-tipo, .seg-forma { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px;
  background: ${b.suave}; border: 1px solid ${b.linha}; border-radius: 16px; }
.seg-tipo { flex: 1; }
.seg-tipo button, .seg-forma button { height: 46px; border-radius: 12px; font-size: 16px; font-weight: 700; color: ${b.tinta2};
  display: flex; align-items: center; justify-content: center; gap: 7px; touch-action: manipulation;
  transition: background .15s ease, color .15s ease, box-shadow .15s ease; }
.seg-tipo button *, .seg-forma button * { pointer-events: none; }
.seg-forma button[data-on="1"] { background: ${b.papel}; color: ${b.tinta};
  box-shadow: 0 1px 2px rgba(11,59,65,.14), 0 3px 10px rgba(11,59,65,.08); }
.seg-tipo button[data-on="1"][data-t="gasto"] { background: ${b.tinta}; color: #fff; box-shadow: 0 3px 10px rgba(11,59,65,.25); }
.seg-tipo button[data-on="1"][data-t="receita"] { background: ${b.acento}; color: #fff; box-shadow: 0 3px 10px rgba(0,109,119,.3); }
.painel-parcelas { margin-top: 10px; border: 1.5px solid ${b.linha}; border-radius: 16px; padding: 14px; background: ${b.papel}; }
.passo { width: 54px; height: 54px; border-radius: 15px; flex-shrink: 0; touch-action: manipulation;
  display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 700; line-height: 1;
  background: ${b.suave}; border: 1.5px solid ${b.linha}; color: ${b.tinta}; }
.passo:active { transform: scale(.93); }
.passo:disabled { opacity: .35; }
.atalhos-parcelas { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 12px; }

.grade { display: grid; grid-template-columns: repeat(2, 1fr); gap: 9px; }
.tile { position: relative; display: flex; align-items: center; justify-content: center;
  padding: 0 6px; height: 54px; border-radius: 13px;
  background: #C6E8D6; color: #0B3B41; font-size: 15.5px; font-weight: 700;
  letter-spacing: -.01em; text-align: center; line-height: 1.15;
  border: 1px solid #A6D9C1;
  box-shadow: 0 3px 0 #8FCBB0, 0 4px 8px rgba(11,59,65,.10);
  transition: transform .09s ease, box-shadow .09s ease, background .12s ease; }
.tile:active { transform: translateY(3px); box-shadow: 0 0 0 #8FCBB0, 0 1px 3px rgba(11,59,65,.12); }
.tile[data-on="1"] { background: ${b.acento}; color: #fff; border-color: #004F57;
  box-shadow: 0 3px 0 #004147, 0 5px 12px rgba(0,109,119,.32); }
.tile[data-on="1"]:active { transform: translateY(3px); box-shadow: 0 0 0 #004147, 0 1px 3px rgba(0,109,119,.3); }

.pessoa { display: inline-flex; align-items: center; justify-content: center; height: 46px; padding: 0 16px;
  border-radius: 999px; font-size: 16.5px; font-weight: 750; letter-spacing: -.01em;
  transition: transform .09s ease, box-shadow .09s ease; }
.pessoa:active { transform: translateY(2px); }
.pessoa[data-p="0"] { background: #D3E7F7; color: #0E3A58; border: 1px solid #A7C8E3; box-shadow: 0 3px 0 #A7C8E3; }
.pessoa[data-p="0"][data-on="1"] { background: #1D6FA5; color: #fff; border-color: #12557F; box-shadow: 0 3px 0 #12557F, 0 4px 10px rgba(29,111,165,.34); }
.pessoa[data-p="1"] { background: #FADDE6; color: #7A2140; border: 1px solid #E8B6C6; box-shadow: 0 3px 0 #E8B6C6; }
.pessoa[data-p="1"][data-on="1"] { background: #B33D68; color: #fff; border-color: #8C2C4F; box-shadow: 0 3px 0 #8C2C4F, 0 4px 10px rgba(179,61,104,.34); }

.b-lancar { width: 100%; height: 72px; border-radius: 18px; background: ${b.acento}; color: #fff;
  font-size: 20.5px; font-weight: 800; letter-spacing: -.02em;
  display: flex; align-items: center; justify-content: center; gap: 10px;
  box-shadow: 0 5px 0 #004147, 0 10px 24px rgba(0,109,119,.34);
  transition: transform .09s ease, box-shadow .09s ease, background .15s ease; }
.b-lancar:active { transform: translateY(5px); box-shadow: 0 0 0 #004147, 0 2px 6px rgba(0,109,119,.3); }
.b-lancar[data-off="1"] { background: #DCE9EC; color: #5A7C84; box-shadow: 0 4px 0 #C0D6DB; }
.b-lancar[data-off="1"]:active { transform: translateY(4px); box-shadow: 0 0 0 #C0D6DB; }

.busca { display: flex; align-items: center; gap: 10px; border: 1.5px solid ${b.linha};
  border-radius: 14px; background: ${b.papel}; padding: 0 12px; height: 52px;
  transition: border-color .15s ease, box-shadow .15s ease; }
.busca:focus-within { border-color: ${b.acento}; box-shadow: 0 0 0 4px rgba(0,109,119,.12); }
.busca-lupa { color: ${b.tinta2}; flex-shrink: 0; }
.busca-campo { flex: 1; min-width: 0; border: 0; outline: none; background: transparent;
  font-size: 16px; font-weight: 550; color: ${b.tinta}; font-family: inherit;
  -webkit-appearance: none; appearance: none; }
.busca-campo::-webkit-search-cancel-button { display: none; }
.busca-campo::placeholder { color: #7C9BA2; font-weight: 500; }
.busca-limpar { width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  background: ${b.suave}; color: ${b.tinta2}; border: 1px solid ${b.linha}; }

.campo-valor { display: flex; align-items: center; gap: 10px;
  border: 2px solid ${b.linha}; border-radius: 16px; background: ${b.papel};
  padding: 10px 14px; min-height: 74px; cursor: text;
  box-shadow: inset 0 2px 6px rgba(11,59,65,.06);
  transition: border-color .15s ease, box-shadow .15s ease; }
.campo-valor:focus-within { border-color: ${b.acento};
  box-shadow: 0 0 0 4px rgba(0,109,119,.14), inset 0 2px 6px rgba(11,59,65,.05); }
.campo-valor[data-vazio="1"] { border-style: dashed; }
.campo-valor-cifrao { font-size: 24px; font-weight: 750; color: ${b.tinta2}; flex-shrink: 0; }
.campo-valor-entrada { flex: 1; min-width: 0; border: 0; outline: none; background: transparent;
  font-weight: 800; letter-spacing: -.03em; padding: 0; width: 100%;
  font-family: inherit; -webkit-appearance: none; appearance: none; }
.campo-valor-entrada::placeholder { color: #9FB9BF; }
.cc .campo-valor-entrada:focus-visible, .cc .busca-campo:focus-visible { outline: none; }
.campo-valor-limpar { width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  background: ${b.suave}; color: ${b.tinta2}; border: 1px solid ${b.linha}; }
.campo-valor-limpar:active { background: ${b.linha}; }

.chip { display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 0 14px; height: 42px;
  border-radius: 999px; border: 1.5px solid ${b.linha}; font-size: 14.5px; font-weight: 650;
  white-space: nowrap; color: ${b.tinta2}; background: ${b.papel}; }
.chip[data-on="1"] { border-color: ${b.tinta}; background: ${b.tinta}; color: #fff; }

.trilho { position: relative; height: 10px; background: ${b.suave}; border-radius: 999px; overflow: hidden; border: 1px solid ${b.linha}; }
.trilho .marca { position: absolute; top: -2px; bottom: -2px; width: 2px; background: ${b.tinta}; opacity: .55; }

.campo { width: 100%; padding: 15px 16px; border: 1.5px solid ${b.linha}; border-radius: 12px;
  font-size: 17px; background: ${b.papel}; color: ${b.tinta}; }
.campo::placeholder { color: #7C9BA2; }
.campo-teto { width: 112px; padding: 10px 12px; border: 1.5px solid ${b.linha}; border-radius: 10px;
  font-size: 16px; font-weight: 650; background: ${b.papel}; color: ${b.tinta}; text-align: right; }

.b-forte { width: 100%; padding: 18px; background: ${b.acento}; color: #fff;
  border-radius: 14px; font-size: 17px; font-weight: 700; letter-spacing: -.01em; }
.b-forte[data-off="1"] { background: #9FB9BF; }
.b-forte:active { filter: brightness(.92); }
.b-fraco { width: 100%; padding: 16px; border: 1.5px solid ${b.linha}; border-radius: 14px;
  font-size: 16px; font-weight: 650; color: ${b.tinta}; }
.b-fraco:disabled { color: #7C9BA2; }

.caixa-quente { background: ${b.quente}; border-radius: 14px; padding: 14px 16px;
  font-size: 14.5px; line-height: 1.55; color: #6B3220; font-weight: 550; }
.caixa-suave { background: ${b.suave}; border: 1px solid ${b.linha}; border-radius: 14px; padding: 14px 16px;
  font-size: 14.5px; line-height: 1.55; color: ${b.tinta2}; font-weight: 550; }

.toast { position: fixed; left: 0; right: 0; margin: 0 auto; width: calc(100% - 32px); max-width: 428px;
  bottom: calc(100px + env(safe-area-inset-bottom, 0px)); z-index: 35;
  background: ${b.tinta}; color: #fff; border-radius: 14px; padding: 13px 16px;
  font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 12px;
  box-shadow: 0 8px 24px rgba(11,59,65,.28); }
.toast[data-erro="1"] { background: ${b.gasto}; }
.toast button { color: ${b.aqua}; font-weight: 750; padding: 6px 4px; }

.notas { position: fixed; top: 0; bottom: 0; left: 0; right: 0; margin: 0 auto; max-width: 460px; pointer-events: none; overflow: hidden; z-index: 30; }
.nota { position: absolute; bottom: 30%; animation: voar 2.9s cubic-bezier(.35,.5,.45,1) forwards; opacity: 0; }
@keyframes voar {
  0%   { transform: translate(0,0) rotate(0deg) scale(.4); opacity: 0; }
  8%   { opacity: 1; }
  35%  { transform: translate(calc(var(--dx) * .3), -110px) rotate(calc(var(--giro) * .4)) scale(1); }
  60%  { transform: translate(calc(var(--dx) * .62), -215px) rotate(calc(var(--giro) * .75)) scale(1); opacity: 1; }
  85%  { opacity: .85; }
  100% { transform: translate(var(--dx), -400px) rotate(var(--giro)) scale(.92); opacity: 0; }
}
.asa { animation-name: bater; animation-iteration-count: infinite; animation-timing-function: ease-in-out; transform-box: fill-box; }
.asa-e { transform-origin: 100% 50%; }
.asa-d { transform-origin: 0% 50%; }
@keyframes bater {
  0%, 100% { transform: scaleY(1) rotate(0deg); }
  50%      { transform: scaleY(.45) rotate(-6deg); }
}
.selo { position: absolute; left: 50%; top: 38%; transform: translate(-50%,-50%);
  width: 84px; height: 84px; border-radius: 50%; background: ${b.acento}; color: #fff;
  display: flex; align-items: center; justify-content: center;
  animation: selo 1.6s ease forwards; z-index: 31; pointer-events: none; }
@keyframes selo {
  0%   { transform: translate(-50%,-50%) scale(.3); opacity: 0; }
  16%  { transform: translate(-50%,-50%) scale(1.08); opacity: 1; }
  28%  { transform: translate(-50%,-50%) scale(1); opacity: 1; }
  82%  { opacity: 1; }
  100% { transform: translate(-50%,-50%) scale(1); opacity: 0; }
}
.cena { line-height: 0; }
.cena-dia .ceu-noite, .cena-noite .ceu-dia { display: none; }
.cena .natal { display: none; }
.cena-natal .natal { display: block; }
.cena .nuvem-a { animation: deriva 26s ease-in-out infinite; }
.cena .nuvem-b { animation: deriva 34s ease-in-out infinite reverse; }
@keyframes deriva { 0%,100% { transform: translateX(0); } 50% { transform: translateX(16px); } }
.cena .astro { animation: pulsa 6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes pulsa { 0%,100% { transform: scale(1); opacity: .95; } 50% { transform: scale(1.06); opacity: 1; } }
.cena .estrelas path { animation: cintila 3.2s ease-in-out infinite; }
.cena .estrelas path:nth-child(2) { animation-delay: .7s; }
.cena .estrelas path:nth-child(3) { animation-delay: 1.4s; }
.cena .estrelas path:nth-child(4) { animation-delay: 2.1s; }
.cena .estrelas path:nth-child(5) { animation-delay: 2.8s; }
@keyframes cintila { 0%,100% { opacity: .45; } 50% { opacity: 1; } }
.cena .fumaca { animation: sobe 5s ease-in-out infinite; transform-box: fill-box; transform-origin: bottom center; }
@keyframes sobe { 0% { opacity: 0; transform: translateY(6px) scale(.9); } 35% { opacity: .9; } 100% { opacity: 0; transform: translateY(-14px) scale(1.12); } }
.cena .bola { animation: quica 3.4s ease-in-out infinite; transform-box: fill-box; transform-origin: bottom center; }
@keyframes quica { 0%,72%,100% { transform: translateY(0) rotate(0deg); } 82% { transform: translateY(-13px) rotate(-16deg); } 92% { transform: translateY(0) rotate(-24deg); } }
.cena .luz { animation: piscaluz 2.4s ease-in-out infinite; }
.cena .luz1 { animation-delay: .6s; } .cena .luz2 { animation-delay: 1.2s; } .cena .luz3 { animation-delay: 1.8s; }
@keyframes piscaluz { 0%,100% { opacity: .45; } 50% { opacity: 1; } }
.cena .borboleta { animation: rota 14s ease-in-out infinite; }
@keyframes rota {
  0%   { transform: translate(96px,128px) scale(.9); }
  25%  { transform: translate(132px,96px) scale(.9); }
  50%  { transform: translate(104px,64px) scale(.9); }
  75%  { transform: translate(66px,102px) scale(.9); }
  100% { transform: translate(96px,128px) scale(.9); }
}
.cena .asa-b { animation: bate .3s ease-in-out infinite; transform-box: fill-box; }
.cena .asa-be { transform-origin: 100% 50%; }
.cena .asa-bd { transform-origin: 0% 50%; }
@keyframes bate { 0%,100% { transform: scaleX(1); } 50% { transform: scaleX(.35); } }

.veu { position: fixed; inset: 0; background: rgba(11,59,65,.55); z-index: 50;
