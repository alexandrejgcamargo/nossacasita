<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EDF6F9">
<meta name="description" content="Contas da nossa casita">
<meta name="robots" content="noindex, nofollow">
<title>Contas da nossa casita</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23006D77'/%3E%3Cpath d='M14 34 L32 19 L50 34' fill='none' stroke='%23FFDDD2' stroke-width='5' stroke-linejoin='round' stroke-linecap='round'/%3E%3Cpath d='M20 32 v16 h24 v-16' fill='none' stroke='%23FFFFFF' stroke-width='5' stroke-linejoin='round'/%3E%3C/svg%3E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Casita">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #EDF6F9; }
  #root { min-height: 100%; }
  #aviso { font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    max-width: 460px; margin: 0 auto; padding: 40px 24px; color: #0B3B41; line-height: 1.6; }
  #aviso code { display: block; background: #fff; border: 1px solid #C5DAE1; border-radius: 10px;
    padding: 12px; margin-top: 12px; font-size: 12px; white-space: pre-wrap; word-break: break-word; color: #B04E2B; }
</style>
</head>
<body>

<!-- ============================================================
     A configuração da nuvem NÃO fica mais aqui: ela é colada dentro do
     próprio app, em Ajustes, e guardada no aparelho. Assim, atualizar
     este arquivo nunca mais apaga as chaves.
     Os campos abaixo existem só como alternativa e podem ficar vazios.
     ============================================================ -->
<script>
  window.__FIREBASE_PROJECT_ID__ = "";
  window.__FIREBASE_API_KEY__   = "";
</script>

  <div id="root">
    <div id="aviso">
      <p><b>Abrindo…</b></p>
      <p style="color:#3F646B;font-size:14px">Se esta mensagem ficar parada, o detalhe do erro aparece aqui embaixo.</p>
    </div>
  </div>

<script>
(function () {
  var mostrou = false;
  function falhou(titulo, detalhe) {
    if (mostrou) return; mostrou = true;
    var a = document.getElementById("aviso");
    if (!a) return;
    a.innerHTML = "<p><b>" + titulo + "</b></p>" +
      "<p style='color:#3F646B;font-size:14px'>Mande esta tela para o Claude.</p>" +
      "<code>" + String(detalhe).replace(/</g, "&lt;") + "</code>";
  }
  window.addEventListener("error", function (e) {
    falhou("O app não abriu.", (e.message || "erro") + "\n" + (e.filename || "") + ":" + (e.lineno || ""));
  });
  window.addEventListener("unhandledrejection", function (e) {
    falhou("O app não abriu.", "Promessa recusada: " + String(e.reason && e.reason.message || e.reason));
  });
  setTimeout(function () {
    if (document.getElementById("aviso")) {
      falhou("O app demorou demais para abrir.",
        "Navegador: " + navigator.userAgent + "\nCriptografia: " +
        (window.crypto && window.crypto.subtle ? "disponível" : "INDISPONÍVEL") +
        "\nArmazenamento: " + (function(){ try { localStorage.setItem("t","1"); localStorage.removeItem("t"); return "disponível"; } catch (x) { return "BLOQUEADO (" + x.name + ")"; } })());
    }
  }, 8000);
})();
</script>

.cc, .cc * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
.cc-fundo { background: ${H.suave}; min-height: 100%; }
.cc {
  font-family: -apple-system, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI",
               "Avenir Next", Inter, system-ui, "Helvetica Neue", Arial, sans-serif;
  color: ${H.tinta}; background: ${H.papel};
  width: 100%; max-width: 460px; margin: 0 auto; min-height: 100%;
  position: relative;
  padding-bottom: calc(80px + env(safe-area-inset-bottom, 0px));
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
@media (min-width: 620px) {
  .cc-fundo { padding: 28px 0; }
  .cc { border-radius: 22px; box-shadow: 0 10px 40px rgba(11,59,65,.12); overflow: hidden; min-height: 720px; }
}
.cc button { font-family: inherit; cursor: pointer; border: 0; background: none; color: inherit; padding: 0; }
.cc input { font-family: inherit; }
.cc button:focus-visible, .cc input:focus-visible { outline: 3px solid ${H.acento}; outline-offset: 2px; border-radius: 8px; }
.n { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }

.t-xl   { font-size: 48px; font-weight: 800; letter-spacing: -.035em; line-height: 1.02; }
.t-tela { font-size: 23px; font-weight: 750; letter-spacing: -.02em; }
.t-num  { font-size: 24px; font-weight: 750; letter-spacing: -.015em; }
.t-item { font-size: 17px; font-weight: 600; letter-spacing: -.005em; }
.t-rot  { font-size: 14.5px; font-weight: 650; color: ${H.tinta2}; letter-spacing: .01em; }
.t-mini { font-size: 13px; font-weight: 550; color: ${H.tinta2}; }

.topo { padding: 16px 20px 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 60px; }
.corpo { padding: 0 20px; }
.divisor { border-bottom: 1px solid ${H.linha}; }
.toque { min-width: 44px; min-height: 44px; display: inline-flex; align-items: center; justify-content: center;
  border-radius: 12px; border: 1px solid ${H.linha}; background: ${H.papel};
  transition: transform .09s ease, background .12s ease; }
.toque:active { background: ${H.suave}; transform: scale(.92); }

/* Linha de lista que abre a edi\xE7\xE3o: precisa parecer toc\xE1vel, n\xE3o texto solto. */
.linha-toque { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
  padding: 10px 12px; border-radius: 14px; background: ${H.papel};
  border: 1px solid ${H.linha}; box-shadow: 0 1px 0 ${H.linha};
  transition: transform .09s ease, background .12s ease; }
.linha-toque:active { background: ${H.suave}; transform: scale(.99); }
.linha-toque .seta { color: #9FB9BF; flex-shrink: 0; }

.nav { position: absolute; bottom: 0; left: 0; right: 0;
  height: calc(86px + env(safe-area-inset-bottom, 0px)); padding-bottom: env(safe-area-inset-bottom, 0px);
  background: ${H.papel}; border-top: 1px solid ${H.linha};
  display: grid; grid-template-columns: repeat(3,1fr); }
.nav button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;
  padding: 8px 4px 10px; font-size: 13px; font-weight: 650; color: ${H.tinta2};
  transition: transform .09s ease; }
.nav button:active { transform: scale(.94); }
.nav button .bolha { display: flex; align-items: center; justify-content: center;
  width: 52px; height: 34px; border-radius: 999px; transition: background .15s ease, color .15s ease; }
.nav button[data-on="1"] { color: ${H.acento}; font-weight: 800; }
.nav button[data-on="1"] .bolha { background: #D6EFE4; }

.grade { display: grid; grid-template-columns: repeat(2, 1fr); gap: 9px; }
.tile { position: relative; display: flex; align-items: center; justify-content: center;
  padding: 0 6px; height: 54px; border-radius: 13px;
  background: #C6E8D6; color: #0B3B41; font-size: 15.5px; font-weight: 700;
  letter-spacing: -.01em; text-align: center; line-height: 1.15;
  border: 1px solid #A6D9C1;
  box-shadow: 0 3px 0 #8FCBB0, 0 4px 8px rgba(11,59,65,.10);
  transition: transform .09s ease, box-shadow .09s ease, background .12s ease; }
.tile:active { transform: translateY(3px); box-shadow: 0 0 0 #8FCBB0, 0 1px 3px rgba(11,59,65,.12); }
.tile[data-on="1"] { background: ${H.acento}; color: #fff; border-color: #004F57;
  box-shadow: 0 3px 0 #004147, 0 5px 12px rgba(0,109,119,.32); }
.tile[data-on="1"]:active { transform: translateY(3px); box-shadow: 0 0 0 #004147, 0 1px 3px rgba(0,109,119,.3); }

.pessoa { display: inline-flex; align-items: center; justify-content: center; height: 46px; padding: 0 16px;
  border-radius: 999px; font-size: 16.5px; font-weight: 750; letter-spacing: -.01em;
  transition: transform .09s ease, box-shadow .09s ease; }
.pessoa:active { transform: translateY(2px); }
.pessoa[data-p="0"] { background: #D3E7F7; color: #0E3A58; border: 1px solid #A7C8E3; box-shadow: 0 3px 0 #A7C8E3; }
.pessoa[data-p="0"][data-on="1"] { background: #1D6FA5; color: #fff; border-color: #12557F; box-shadow: 0 3px 0 #12557F, 0 4px 10px rgba(29,111,165,.34); }
.pessoa[data-p="1"] { background: #FADDE6; color: #7A2140; border: 1px solid #E8B6C6; box-shadow: 0 3px 0 #E8B6C6; }
.pessoa[data-p="1"][data-on="1"] { background: #B33D68; color: #fff; border-color: #8C2C4F; box-shadow: 0 3px 0 #8C2C4F, 0 4px 10px rgba(179,61,104,.34); }

.b-lancar { width: 100%; height: 72px; border-radius: 18px; background: ${H.acento}; color: #fff;
  font-size: 20.5px; font-weight: 800; letter-spacing: -.02em;
  display: flex; align-items: center; justify-content: center; gap: 10px;
  box-shadow: 0 5px 0 #004147, 0 10px 24px rgba(0,109,119,.34);
  transition: transform .09s ease, box-shadow .09s ease, background .15s ease; }
.b-lancar:active { transform: translateY(5px); box-shadow: 0 0 0 #004147, 0 2px 6px rgba(0,109,119,.3); }
.b-lancar[data-off="1"] { background: #DCE9EC; color: #5A7C84; box-shadow: 0 4px 0 #C0D6DB; }
.b-lancar[data-off="1"]:active { transform: translateY(4px); box-shadow: 0 0 0 #C0D6DB; }

.busca { display: flex; align-items: center; gap: 10px; border: 1.5px solid ${H.linha};
  border-radius: 14px; background: ${H.papel}; padding: 0 12px; height: 52px;
  transition: border-color .15s ease, box-shadow .15s ease; }
