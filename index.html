<script>

  })();
</script>

.cc {
  --fundo:${we.fundo}; --superficie:${we.superficie}; --texto:${we.texto}; --texto-2:${we.texto2}; --texto-3:${we.texto3};
  --borda:${we.borda}; --divisor:${we.divisor}; --acao:${we.acao}; --acao-press:${we.acaoPress}; --acao-suave:${we.acaoSuave};
  --acao-clara:${we.acaoClara}; --alerta-fundo:${we.alertaFundo}; --alerta-texto:${we.alertaTexto}; --destaque:${we.destaque};
  --perigo:${we.perigo}; --perigo-texto:${we.perigoTexto}; --p1:${we.p1}; --p1-clara:${we.p1Clara}; --p2:${we.p2}; --p2-clara:${we.p2Clara};
  --sobre-acao:#FFFFFF; --vidro:rgba(255,255,255,.96); --trilho:#E3EDF0; --trilho-2:#C9D9DE; --heroi:#0B3B41;
  --erro-fundo:#FBE3DA; --erro-borda:#E8B8A6; --arte-fundo:#EDF6F9; --arte-chao:#DCEEF3;
  color-scheme: light;
  --t1:.78rem; --t2:.9rem; --t3:1rem; --t4:1.2rem; --t5:1.65rem; --t6:2.6rem;
  --fonte: -apple-system, system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --fonte-titulo: ui-rounded, "SF Pro Rounded", -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
  --nav: calc(76px + env(safe-area-inset-bottom, 0px));
  --raio: 14px;
  font-family: var(--fonte); color: var(--texto); background: var(--superficie);
  font-size: var(--t3); line-height: 1.4;
  width: 100%; max-width: 460px; margin: 0 auto; min-height: 100vh; position: relative;
  padding-bottom: calc(var(--nav) + 24px);
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
.cc[data-acao="1"] { padding-bottom: calc(var(--nav) + 104px); }
.cc[data-sem-nav="1"] { padding-bottom: 0; }
.cc, .cc * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
.cc :where(button) { font: inherit; cursor: pointer; border: 0; background: none; color: inherit; padding: 0; touch-action: manipulation; }
.cc :where(input) { font: inherit; color: inherit; }
.cc :where(h1, h2, h3, p) { margin: 0; }
.cc button:focus-visible, .cc input:focus-visible, .cc a:focus-visible, .cc [tabindex]:focus-visible { outline: 3px solid var(--acao); outline-offset: 2px; }
@media (min-width: 620px) {
  .cc-fundo { padding-top: 28px; }
  .cc { border-radius: 22px 22px 0 0; box-shadow: 0 10px 40px rgba(11,59,65,.12); min-height: calc(100vh - 28px); }
}
.cc-fundo { background: ${we.fundo}; min-height: 100vh; }
.n { font-variant-numeric: tabular-nums; }
.so-leitor { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

/* ---------------- tipografia ---------------- */
.titulo { font-family: var(--fonte-titulo); font-size: var(--t5); font-weight: 800; letter-spacing: -.02em; line-height: 1.15; }
.secao-titulo { font-size: var(--t4); font-weight: 800; letter-spacing: -.01em; margin-bottom: 12px; }
.rotulo { display: block; font-size: var(--t2); font-weight: 650; color: var(--texto-2); margin-bottom: 8px; }
.legenda { font-size: var(--t1); font-weight: 500; color: var(--texto-2); line-height: 1.45; }
.apoio { font-size: var(--t2); color: var(--texto-2); line-height: 1.5; }
.destaque-num { font-family: var(--fonte-titulo); font-size: min(var(--t6), 10.5vw); font-weight: 800; letter-spacing: -.03em; line-height: 1.05; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }

/* ---------------- estrutura ---------------- */
.tela { padding: 0 16px; }
.cabecalho { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 16px 12px; min-height: 64px; }
.cabecalho-fixo { position: sticky; top: 0; z-index: 5; background: var(--vidro); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border-bottom: 1px solid var(--divisor); }
.secao { margin-top: 32px; }
.secao:first-child { margin-top: 16px; }
.pilha > * + * { margin-top: 12px; }
.linha-flex { display: flex; align-items: center; gap: 8px; }
.entre { display: flex; align-items: center; justify-content: space-between; gap: 12px; }

/* ---------------- bot\xF5es ---------------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 0 20px;
  border-radius: var(--raio); font-size: var(--t3); font-weight: 650; line-height: 1.2; text-align: center;
  transition: transform .08s ease, box-shadow .08s ease, background .15s ease; }
.btn-bloco { display: flex; width: 100%; }
.btn-grande { min-height: 64px; font-size: var(--t4); font-weight: 800; border-radius: 18px; }
.btn-principal { background: var(--acao); color: var(--sobre-acao); box-shadow: 0 4px 0 var(--acao-press); }
.btn-principal:active { transform: translateY(4px); box-shadow: 0 0 0 var(--acao-press); }
.btn-principal[aria-disabled="true"] { background: var(--trilho); color: var(--texto-2); box-shadow: 0 4px 0 var(--trilho-2); }
.btn-principal[aria-disabled="true"]:active { transform: none; box-shadow: 0 4px 0 var(--trilho-2); }
.btn-secundario { background: var(--superficie); color: var(--texto); border: 1.5px solid var(--borda); }
.btn-secundario:active { background: var(--fundo); }
.btn-texto { min-height: 44px; padding: 0 8px; color: var(--acao); font-weight: 650; }
.btn-texto:active { background: var(--fundo); }
.btn-perigo { background: var(--perigo); color: #fff; box-shadow: 0 4px 0 #7A3216; }
.btn-perigo:active { transform: translateY(4px); box-shadow: none; }
.btn-perigo[aria-disabled="true"] { background: #EBD3C9; color: #6B4436; box-shadow: none; }
.btn-perigo-sec { background: var(--superficie); color: var(--perigo-texto); border: 1.5px solid #D9A28D; }
.btn-icone { min-width: 44px; min-height: 44px; display: inline-flex; align-items: center; justify-content: center;
  border-radius: 12px; color: var(--texto); }
.btn-icone:active { background: var(--fundo); }
.btn-icone-borda { border: 1.5px solid var(--divisor); background: var(--superficie); }

/* ---------------- seletores ---------------- */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; padding: 4px;
  background: var(--fundo); border: 1px solid var(--divisor); border-radius: 16px; }
.seg button { min-height: 44px; padding: 4px 8px; border-radius: 12px; font-size: var(--t3); font-weight: 650; color: var(--texto-2);
  display: flex; align-items: center; justify-content: center; gap: 6px; line-height: 1.15; }
.seg button[aria-pressed="true"] { background: var(--superficie); color: var(--texto); font-weight: 800;
  box-shadow: 0 1px 2px rgba(11,59,65,.16), 0 3px 10px rgba(11,59,65,.08); }
.seg-grande button { min-height: 50px; font-size: var(--t4); }
.seg button svg { pointer-events: none; }

.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 16px; border-radius: 999px;
  border: 1.5px solid var(--divisor); background: var(--superficie); font-size: var(--t2); font-weight: 650; color: var(--texto); white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--texto); border-color: var(--texto); color: var(--superficie); }
.chip:active { transform: scale(.97); }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 2px 16px; margin: 0 -16px; }
.chips::-webkit-scrollbar { display: none; }
.chips-quebra { display: flex; flex-wrap: wrap; gap: 8px; }

/* Quem pagou: iniciais na bolinha, para n\xE3o depender s\xF3 da cor. */
.pessoas { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.pessoa { display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 56px; padding: 6px 12px;
  border-radius: 999px; border: 1.5px solid var(--divisor); background: var(--superficie); font-size: var(--t4); font-weight: 650; }
.pessoa .ini { width: 30px; height: 30px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
  font-size: var(--t2); font-weight: 800; color: #fff; flex-shrink: 0; }
.pessoa[data-p="0"] .ini { background: var(--p1); } .pessoa[data-p="1"] .ini { background: var(--p2); }
.pessoa[data-p="0"][aria-pressed="true"] { background: var(--p1-clara); border-color: var(--p1); box-shadow: inset 0 0 0 1px var(--p1); }
.pessoa[data-p="1"][aria-pressed="true"] { background: var(--p2-clara); border-color: var(--p2); box-shadow: inset 0 0 0 1px var(--p2); }

/* Categorias: \xEDcone e cor de cada uma, 3 por linha. */
.cats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.cat { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
  min-height: 84px; padding: 10px 4px 8px; border-radius: var(--raio); border: 1.5px solid var(--divisor); background: var(--superficie);
  font-size: var(--t2); font-weight: 650; line-height: 1.15; text-align: center; overflow-wrap: anywhere; }
.cat:active { transform: scale(.97); }
.cat[aria-pressed="true"] { border-color: var(--acao); background: var(--acao-clara); box-shadow: inset 0 0 0 1.5px var(--acao); font-weight: 800; }
.cat .marca { position: absolute; top: 6px; right: 6px; width: 20px; height: 20px; border-radius: 50%; background: var(--acao); color: var(--sobre-acao);
  display: flex; align-items: center; justify-content: center; }
.ico-cat { display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; border-radius: 10px; color: #0B3B41; }

/* ---------------- campos ---------------- */
.campo { width: 100%; min-height: 52px; padding: 12px 14px; border: 1.5px solid var(--borda); border-radius: 12px;
  background: var(--superficie); font-size: var(--t3); }
.campo::placeholder { color: var(--texto-3); }
.campo:focus { outline: none; border-color: var(--acao); box-shadow: 0 0 0 3px rgba(0,109,119,.18); }
.campo[aria-invalid="true"] { border-color: var(--perigo); }
.campo-dica { margin-top: 6px; }
.campo-erro { margin-top: 8px; color: var(--perigo-texto); font-size: var(--t2); font-weight: 650; }
.campo-senha { position: relative; }
.campo-senha .campo { padding-right: 56px; }
.campo-senha .btn-icone { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); color: var(--texto-2); }

.valor { display: flex; align-items: center; gap: 8px; min-height: 76px; padding: 8px 8px 8px 16px; border-radius: 18px;
  border: 2px solid var(--borda); background: var(--superficie); cursor: text; }
.valor:focus-within { border-color: var(--acao); box-shadow: 0 0 0 4px rgba(0,109,119,.16); }
.valor-rs { font-family: var(--fonte-titulo); font-size: var(--t4); font-weight: 800; color: var(--texto-2); }
.valor input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; padding: 0;
  font-family: var(--fonte-titulo); font-weight: 800; letter-spacing: -.03em; font-size: var(--t6); font-variant-numeric: tabular-nums; }
.valor input::placeholder { color: #8FA9B0; }
.valor input:focus-visible { outline: none; }

/* ---------------- listas e cart\xF5es ---------------- */
.cartao { border: 1px solid var(--divisor); border-radius: 18px; padding: 16px; background: var(--superficie); }
.cartao-suave { background: var(--fundo); border: 1px solid var(--divisor); border-radius: 18px; padding: 16px; }
.heroi { background: var(--heroi); color: #fff; border-radius: 22px; padding: 20px; }
.heroi .legenda, .heroi .apoio { color: #CFE5E9; }
.heroi-linha.com-pote { grid-template-columns: 1fr 1fr auto; gap: 8px; }
.heroi-linha.com-pote .heroi-valor { font-size: min(var(--t4), 4.4vw); }
.pote-heroi { align-self: end; display: flex; flex-direction: column; align-items: center; gap: 2px; flex-shrink: 0; }
.pote-heroi .legenda { font-size: .7rem; white-space: nowrap; font-weight: 700; }
.pote-enche { transform-box: fill-box; transform-origin: 50% 100%; animation: enche 1.1s .15s cubic-bezier(.3,.7,.3,1) both; }
@keyframes enche { from { transform: scaleY(0); } to { transform: none; } }
.pets-linha { display: flex; align-items: center; gap: 12px; padding-bottom: 12px; margin-bottom: 12px; border-bottom: 1px solid var(--trilho); }
.pets-linha svg { flex-shrink: 0; }
.pets-feliz { animation: pula 1.4s ease-in-out 2; transform-origin: 50% 100%; }
@keyframes pula { 0%,100% { transform: none; } 20% { transform: translateY(-3px); } 40% { transform: none; } }
.fechamento { display: flex; gap: 12px; align-items: center; }
.resumo-previa { border-radius: 16px; overflow: hidden; border: 1px solid var(--divisor); }
.resumo-previa svg { display: block; }
.heroi-linha { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,.18); }
.heroi-valor { font-size: min(var(--t4), 5.6vw); font-weight: 800; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; line-height: 1.2; }

.linha { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 60px; padding: 8px 4px; text-align: left; border-radius: 12px; }
.linha:active { background: var(--fundo); }
.linha-meio { flex: 1; min-width: 0; }
.linha-nome { font-size: var(--t3); font-weight: 650; line-height: 1.25; overflow-wrap: anywhere; }
.linha-sub { font-size: var(--t1); color: var(--texto-2); line-height: 1.35; margin-top: 2px; overflow-wrap: anywhere; }
.linha-valor { font-size: var(--t3); font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }
.linha + .linha { border-top: 1px solid var(--trilho); }
.dia-cab { display: flex; justify-content: space-between; align-items: baseline; padding: 20px 4px 4px; font-size: var(--t2); font-weight: 800; color: var(--texto-2); }
.receita-valor { color: var(--acao); }

.barra { height: 8px; border-radius: 999px; background: var(--trilho); overflow: hidden; position: relative; }
.barra > span { display: block; height: 100%; border-radius: 999px; }
.barra .teto { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--texto); }

.aviso { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: var(--raio); font-size: var(--t2); line-height: 1.5; font-weight: 500; }
.aviso svg { flex-shrink: 0; margin-top: 2px; }
.aviso-info { background: var(--fundo); color: var(--texto); border: 1px solid var(--divisor); }
.aviso-alerta { background: var(--alerta-fundo); color: var(--alerta-texto); }
.aviso-erro { background: var(--erro-fundo); color: var(--perigo-texto); border: 1px solid var(--erro-borda); }

.vazio { text-align: center; padding: 24px 8px 8px; }
.vazio p { margin: 8px 0 16px; color: var(--texto-2); font-size: var(--t3); }

/* ---------------- faixa de status ---------------- */
.faixa { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 10px; padding: 10px 16px;
  background: var(--alerta-fundo); color: var(--alerta-texto); font-size: var(--t2); font-weight: 650; line-height: 1.35; }
.faixa .btn-texto { color: var(--alerta-texto); text-decoration: underline; min-height: 36px; margin-left: auto; white-space: nowrap; }

/* ---------------- rodap\xE9 e barra de a\xE7\xE3o ---------------- */
.nav { position: fixed; left: 0; right: 0; bottom: 0; margin: 0 auto; max-width: 460px; z-index: 30;
  height: var(--nav); padding: 6px 8px env(safe-area-inset-bottom, 0px);
  background: var(--vidro); -webkit-backdrop-filter: saturate(1.6) blur(14px); backdrop-filter: saturate(1.6) blur(14px);
  border-top: 1px solid var(--divisor); display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.nav button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 60px;
  border-radius: 16px; font-size: var(--t1); font-weight: 650; color: var(--texto-2); user-select: none; -webkit-user-select: none; }
.nav button * { pointer-events: none; }
.nav .bolha { display: flex; align-items: center; justify-content: center; width: 56px; height: 32px; border-radius: 999px; transition: background .15s ease; }
.nav button[aria-current="page"] { color: var(--acao); font-weight: 800; }
.nav button[aria-current="page"] .bolha { background: var(--acao); color: var(--sobre-acao); }
.nav button:active .bolha { transform: scale(.92); }
.barra-acao { position: fixed; left: 0; right: 0; margin: 0 auto; max-width: 460px; bottom: var(--nav); z-index: 25;
  padding: 10px 16px 12px; background: linear-gradient(180deg, transparent, var(--superficie) 22%); }
@media (min-width: 620px) { .nav { border-radius: 22px 22px 0 0; border-left: 1px solid var(--divisor); border-right: 1px solid var(--divisor); } }

/* ---------------- folha (janela de baixo) ---------------- */
.veu { position: fixed; inset: 0; z-index: 60; background: rgba(11,59,65,.5); display: flex; align-items: flex-end; justify-content: center; animation: veu .18s ease; }
.folha { width: 100%; max-width: 460px; max-height: 92vh; overflow-y: auto; background: var(--superficie);
  border-radius: 20px 20px 0 0; padding: 8px 16px calc(24px + env(safe-area-inset-bottom, 0px)); animation: sobe .22s cubic-bezier(.2,.8,.3,1); }
.folha-pega { width: 40px; height: 5px; border-radius: 3px; background: var(--divisor); margin: 4px auto 12px; }
@keyframes veu { from { opacity: 0; } to { opacity: 1; } }
@keyframes sobe { from { transform: translateY(40px); opacity: .6; } to { transform: none; opacity: 1; } }

/* ---------------- aviso flutuante ---------------- */
.toast { position: fixed; left: 0; right: 0; margin: 0 auto; width: calc(100% - 32px); max-width: 428px; z-index: 40;
  bottom: calc(var(--nav) + 12px); background: var(--heroi); color: #fff; border-radius: 14px; padding: 12px 8px 12px 16px;
  font-size: var(--t2); font-weight: 650; display: flex; align-items: center; gap: 8px; box-shadow: 0 8px 24px rgba(11,59,65,.28); line-height: 1.4; }
.cc[data-acao="1"] .toast { bottom: calc(var(--nav) + 92px); }
.toast[data-tipo="erro"] { background: #9A3F20; }
.toast[data-tipo="alerta"] { background: #7A4A0E; }
.toast .btn-texto { color: #A6E3DC; font-weight: 800; margin-left: auto; }

/* ---------------- festa ao lan\xE7ar ---------------- */
.notas { position: fixed; top: 0; bottom: 0; left: 0; right: 0; margin: 0 auto; max-width: 460px; pointer-events: none; overflow: hidden; z-index: 35; }
.nota { position: absolute; bottom: 22%; opacity: 0; animation: voar 1.5s cubic-bezier(.3,.6,.4,1) forwards; }
@keyframes voar {
  0% { transform: translate(0,0) rotate(0) scale(.5); opacity: 0; }
  12% { opacity: 1; }
  70% { opacity: 1; }
  100% { transform: translate(var(--dx), -260px) rotate(var(--giro)) scale(.9); opacity: 0; }
}
.asa { animation: bater .32s ease-in-out infinite; transform-box: fill-box; }
.asa-e { transform-origin: 100% 50%; } .asa-d { transform-origin: 0% 50%; }
@keyframes bater { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(.45); } }
.selo { position: absolute; left: 50%; top: 40%; width: 76px; height: 76px; margin: -38px 0 0 -38px; border-radius: 50%;
  background: var(--acao); color: var(--sobre-acao); display: flex; align-items: center; justify-content: center; animation: selo 1.1s ease forwards; }
@keyframes selo { 0% { transform: scale(.3); opacity: 0; } 20% { transform: scale(1.08); opacity: 1; } 35% { transform: scale(1); } 75% { opacity: 1; } 100% { opacity: 0; transform: scale(.96); } }

/* ---------------- gr\xE1ficos ---------------- */
.evol { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; align-items: end; height: 150px; }
.evol button { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 4px; border-radius: 10px; padding: 0 2px; }
.evol .col { position: relative; width: 100%; max-width: 34px; flex: 1; display: flex; align-items: flex-end; }
.evol .gasto { width: 100%; border-radius: 6px 6px 3px 3px; background: var(--acao-suave); }
.evol button[aria-current="true"] .gasto { background: var(--acao); }
.evol .rec { position: absolute; left: -3px; right: -3px; height: 3px; border-radius: 2px; background: var(--destaque); }
.evol .num { font-size: .68rem; font-weight: 650; color: var(--texto-2); white-space: nowrap; }
.evol .mes { font-size: var(--t1); font-weight: 650; color: var(--texto-2); }
.evol button[aria-current="true"] .mes { color: var(--texto); font-weight: 800; }

/* ---------------- modo escuro (segue o ajuste do celular) ---------------- */
@media (prefers-color-scheme: dark) {
  .cc {
    --fundo:#0C1F23; --superficie:#12292E; --texto:#E4F1F3; --texto-2:#A9C5CB; --texto-3:#8DAEB5;
    --borda:#6D8F97; --divisor:#2B4A50; --acao:#6CCCC2; --acao-press:#3B958C; --acao-suave:#3F8F88; --acao-clara:#173F3F;
    --alerta-fundo:#4A2B21; --alerta-texto:#FFD6C6; --destaque:#E9A184; --perigo:#B04E2B; --perigo-texto:#F4A98C;
    --p1-clara:#15344B; --p2-clara:#45202F;
    --sobre-acao:#06292D; --vidro:rgba(18,41,46,.94); --trilho:#23434A; --trilho-2:#35585F; --heroi:#0F4148;
    --erro-fundo:#45231A; --erro-borda:#7A3C28; --arte-fundo:#173339; --arte-chao:#1E3F45;
    color-scheme: dark;
  }
  .cc-fundo { background: #081619; }
  .heroi { box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); }
  .toast { box-shadow: 0 8px 24px rgba(0,0,0,.45), inset 0 0 0 1px rgba(255,255,255,.12); }
  .btn-perigo[aria-disabled="true"] { background: #3A2620; color: #C9A497; }
  .valor input::placeholder { color: #6E8D94; }
  .veu { background: rgba(0,0,0,.6); }
}

@media (prefers-reduced-motion: reduce) {
  .cc *, .cc *::before, .cc *::after { animation: none !important; transition: none !important; }
  .notas { display: none; }

.entrada { min-height: 100vh; display: flex; flex-direction: column; }
.palco { position: relative; padding: 70px 0 0; min-height: 44vh; display: flex; flex-direction: column; justify-content: flex-end;
  transition: background .6s ease; overflow: hidden; }
.palco-manha { background: linear-gradient(180deg, #D3ECF2 0%, #EDF6F9 100%); }
.palco-tarde { background: linear-gradient(180deg, #FFD9C9 0%, #FFF1EA 100%); }
.palco-noite { background:
  radial-gradient(1.6px 1.6px at 12% 18%, #FFF2C4 50%, transparent 51%), radial-gradient(1.2px 1.2px at 28% 32%, #FFF2C4 50%, transparent 51%),
  radial-gradient(1.8px 1.8px at 47% 12%, #FFF2C4 50%, transparent 51%), radial-gradient(1.2px 1.2px at 66% 26%, #FFF2C4 50%, transparent 51%),
  radial-gradient(1.6px 1.6px at 84% 14%, #FFF2C4 50%, transparent 51%), radial-gradient(1.2px 1.2px at 92% 36%, #FFF2C4 50%, transparent 51%),
  radial-gradient(1.2px 1.2px at 6% 42%, #FFF2C4 50%, transparent 51%), radial-gradient(1.4px 1.4px at 38% 44%, #FFF2C4 50%, transparent 51%),
  linear-gradient(180deg, #082C31 0%, #144F57 100%); }
.palco-manha { background: radial-gradient(120px 120px at 82% 22%, rgba(255,221,210,.9), transparent 70%), linear-gradient(180deg, #D3ECF2 0%, #EDF6F9 100%); }
.palco-tarde { background: radial-gradient(160px 160px at 18% 30%, rgba(226,149,120,.45), transparent 70%), linear-gradient(180deg, #FFD9C9 0%, #FFF1EA 100%); }
/* T\xEDtulo no c\xE9u: chega uma vez e fica. O estado final \xE9 o estilo base (vale para "reduzir movimento"). */
.titulo-ceu { position: absolute; top: max(12px, env(safe-area-inset-top, 0px)); left: 0; right: 0; margin: 0; height: 48px;
  display: flex; align-items: center; justify-content: center; pointer-events: none; z-index: 1;
  font-family: var(--fonte-titulo); font-weight: 800; font-size: 1.02rem; letter-spacing: .01em; color: #0B3B41; }
.voo { animation: voa-tarde 3s cubic-bezier(.2,.7,.25,1) both; }
.voo .corda { width: 16px; height: 0; border-top: 1.6px solid #0B3B41; flex-shrink: 0; }
.faixa-titulo { background: #FFF4E4; border: 2px solid #0B3B41; border-radius: 6px; padding: 4px 12px 5px; white-space: nowrap;
  box-shadow: 0 3px 0 rgba(11,59,65,.12); transform-origin: left center; }
.voo-aviao .faixa-titulo { animation: tremula .5s ease-in-out 6; }
@keyframes voa-tarde { from { transform: translateX(110vw); } to { transform: none; } }
@keyframes tremula { 0%,100% { transform: skewY(0); } 50% { transform: skewY(1.6deg); } }
.voo-aviao .helice { transform-box: fill-box; transform-origin: center; animation: helice .12s linear 25; }
@keyframes helice { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(.2); } }
.voo-balao { align-items: flex-end; height: 50px; animation: voa-manha 3.2s cubic-bezier(.25,.7,.3,1) both; }
.voo-balao .corda { margin-bottom: 15px; width: 12px; transform: rotate(-12deg); }
.voo-balao .faixa-titulo { margin-bottom: 2px; }
@keyframes voa-manha { from { transform: translate(-80vw, 34px); } 70% { transform: translate(4px, -3px); } to { transform: none; } }
.voo-estrela { color: #FFF2C4; text-shadow: 0 0 10px rgba(255,242,196,.55); }
.risco { position: relative; display: inline-block; padding-right: 4px; animation: desce 1.6s cubic-bezier(.3,.6,.3,1) both; }
.risco-texto { display: inline-block; animation: revela 1.6s cubic-bezier(.3,.6,.3,1) both; }
.risco::before { content: ""; position: absolute; left: -36px; right: 6px; top: 50%; height: 14px; transform: translateY(-50%);
  background: linear-gradient(90deg, rgba(255,242,196,0), rgba(255,242,196,.45)); border-radius: 99px; filter: blur(2px);
  opacity: 0; animation: cauda 3s ease both; }
.estrela-cadente { position: absolute; left: 100%; top: 50%; transform: translate(0,-62%); filter: drop-shadow(0 0 5px rgba(255,242,196,.9));
  animation: estrela 1.6s cubic-bezier(.3,.6,.3,1) both; }
@keyframes revela { from { clip-path: inset(-20% 100% -20% 0); } to { clip-path: inset(-20% 0 -20% 0); } }
@keyframes estrela { from { left: 0%; } to { left: 100%; } }
@keyframes desce { from { transform: translate(-24px,-16px); } to { transform: none; } }
@keyframes cauda { 0% { opacity: 1; clip-path: inset(0 100% 0 0); } 53% { opacity: 1; clip-path: inset(0 0 0 0); } 100% { opacity: 0; clip-path: inset(0 0 0 0); } }

/* Cores do ch\xE3o por per\xEDodo */
.morro-1 { fill: #BFE0DA; } .morro-2 { fill: #A8D5CC; } .gramado { fill: #DCF0EA; } .gramado-borda { stroke: #83C5BE; } .tufos { stroke: #9BD2CB; }
.palco-tarde .morro-1 { fill: #F1C6B1; } .palco-tarde .morro-2 { fill: #CFDDC0; } .palco-tarde .gramado { fill: #E6F1E2; }
.palco-noite .morro-1 { fill: #0F3E45; } .palco-noite .morro-2 { fill: #144A50; } .palco-noite .gramado { fill: #1B5458; }
.palco-noite .gramado-borda { stroke: #2C7470; } .palco-noite .tufos { stroke: #2C7470; }
.trilha { fill: #F1E6D1; stroke: #D9C6A3; stroke-width: 1.6; }
.pedras ellipse { fill: #FBF6EC; stroke: #D9C6A3; stroke-width: 1.2; }
.palco-noite .trilha { fill: #4B6A62; stroke: #5E7D73; } .palco-noite .pedras ellipse { fill: #6E8C80; stroke: #5E7D73; }
.lampiao-luz { fill: none; } .lampiao-vidro { fill: #FFF4E4; }
.palco-noite .lampiao-luz { fill: rgba(255,217,138,.28); } .palco-noite .lampiao-vidro { fill: #FFD98A; }

/* A fam\xEDlia chega pelo caminho (uma vez) e entra na casa com a senha certa. */
.familia { transform-box: fill-box; transform-origin: 50% 100%; animation: chega 2.6s cubic-bezier(.3,.55,.35,1) both; }
@keyframes chega { from { transform: translate(2px, 24px) scale(1.12); } to { transform: none; } }
.familia .passo-a { animation: passo-a .52s ease-in-out 5; }
.familia .passo-b { animation: passo-b .52s ease-in-out 5; }
.familia .pequeno .passo-a { animation: passo-a .325s ease-in-out 8; }
.familia .pequeno .passo-b { animation: passo-b .325s ease-in-out 8; }
.familia .tronco { animation: balanca .26s ease-in-out 10; }
@keyframes passo-a { 0%,50%,100% { transform: translateY(0); } 25% { transform: translateY(-1.8px); } }
@keyframes passo-b { 0%,50%,100% { transform: translateY(0); } 75% { transform: translateY(-1.8px); } }
@keyframes balanca { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-.6px); } }
.palco.abrindo .familia { animation: entra-familia 1s cubic-bezier(.45,0,.6,1) forwards; }
.palco.abrindo .familia .passo-a { animation: passo-a .4s ease-in-out infinite; }
.palco.abrindo .familia .passo-b { animation: passo-b .4s ease-in-out infinite; }
.palco.abrindo .familia .tronco { animation: balanca .2s ease-in-out infinite; }
@keyframes entra-familia { 0% { transform: none; opacity: 1; } 82% { opacity: 1; } 100% { transform: translate(15px,-63px) scale(.36); opacity: 0; } }

.cena-svg { display: block; width: 100%; max-width: 480px; margin: 0 auto 14px; }
.halo { fill: rgba(255,255,255,.45); }
.palco-noite .halo { fill: rgba(255,255,255,.06); }
.palco-manha .ceu-noite, .palco-tarde .ceu-noite, .palco-noite .ceu-dia { display: none; }
.cena-svg .natal { display: none; }
.palco[data-natal="1"] .natal { display: block; }
.interior { opacity: 0; }
.fechados { display: none; }
.balao { opacity: 0; transform-box: fill-box; transform-origin: 10px 36px; }
.porta { transform-box: fill-box; transform-origin: left center; transition: transform .6s cubic-bezier(.5,0,.3,1); }
.rabo { transform-box: fill-box; transform-origin: 90% 95%; }
.olhos { transform-box: fill-box; transform-origin: center; }

.palco .nuvem-a { animation: deriva 26s ease-in-out infinite; }
.palco .nuvem-b { animation: deriva 34s ease-in-out infinite reverse; }
@keyframes deriva { 0%,100% { transform: translateX(0); } 50% { transform: translateX(16px); } }
.palco .astro { animation: pulsa 6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes pulsa { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
.palco .estrelas path { animation: cintila 3.2s ease-in-out infinite; }
.palco .estrelas path:nth-child(2) { animation-delay: .7s; } .palco .estrelas path:nth-child(3) { animation-delay: 1.4s; }
.palco .estrelas path:nth-child(4) { animation-delay: 2.1s; } .palco .estrelas path:nth-child(5) { animation-delay: 2.8s; }
@keyframes cintila { 0%,100% { opacity: .45; } 50% { opacity: 1; } }
.palco .fumaca { animation: sobe-fumaca 5s ease-in-out infinite; transform-box: fill-box; transform-origin: bottom center; }
@keyframes sobe-fumaca { 0% { opacity: 0; transform: translateY(6px) scale(.9); } 35% { opacity: .9; } 100% { opacity: 0; transform: translateY(-14px) scale(1.12); } }
.palco .bola { animation: quica 3.4s ease-in-out infinite; transform-box: fill-box; transform-origin: bottom center; }
@keyframes quica { 0%,72%,100% { transform: translateY(0) rotate(0); } 82% { transform: translateY(-13px) rotate(-16deg); } 92% { transform: translateY(0) rotate(-24deg); } }
.palco .luz { animation: piscaluz 2.4s ease-in-out infinite; }
.palco .luz1 { animation-delay: .6s; } .palco .luz2 { animation-delay: 1.2s; } .palco .luz3 { animation-delay: 1.8s; }
@keyframes piscaluz { 0%,100% { opacity: .45; } 50% { opacity: 1; } }
.palco .borboleta { animation: rota 14s ease-in-out infinite; }
@keyframes rota { 0%,100% { transform: translate(96px,128px) scale(.9); } 25% { transform: translate(132px,96px) scale(.9); }
  50% { transform: translate(104px,64px) scale(.9); } 75% { transform: translate(66px,102px) scale(.9); } }
.palco .asa-b { animation: bate .3s ease-in-out infinite; transform-box: fill-box; }
.palco .asa-be { transform-origin: 100% 50%; } .palco .asa-bd { transform-origin: 0% 50%; }
@keyframes bate { 0%,100% { transform: scaleX(1); } 50% { transform: scaleX(.35); } }
.palco .olhos { animation: piscar 5s ease-in-out infinite; }
@keyframes piscar { 0%,44%,50%,100% { transform: scaleY(1); } 47% { transform: scaleY(.1); } }
/* Depois de 8 segundos a cena para; s\xF3 reage ao que voc\xEA faz. */
.palco.parado .nuvem-a, .palco.parado .nuvem-b, .palco.parado .astro, .palco.parado .estrelas path, .palco.parado .fumaca,
.palco.parado .bola, .palco.parado .luz, .palco.parado .borboleta, .palco.parado .asa-b, .palco.parado .olhos { animation-play-state: paused; }

.palco.digitando .rabo { animation: abana .28s ease-in-out infinite; }
@keyframes abana { 0%,100% { transform: rotate(-10deg); } 50% { transform: rotate(12deg); } }
.palco.digitando .brilho-fechadura { animation: brilha 1.2s ease-in-out infinite; }
@keyframes brilha { 0%,100% { opacity: .2; } 50% { opacity: .9; } }
.palco.mostrando .olhos { display: none; }
.palco.mostrando .fechados { display: inline; }
.palco.erro .porta { animation: treme .45s ease-in-out; }
@keyframes treme { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-4px); } 40% { transform: translateX(4px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
.palco.erro .balao { animation: pop 1.6s ease forwards; }
@keyframes pop { 0% { opacity: 0; transform: scale(.4); } 15% { opacity: 1; transform: scale(1.1); } 25% { transform: scale(1); } 80% { opacity: 1; } 100% { opacity: 0; } }
.palco.abrindo .porta { transform: scaleX(.12) skewY(-8deg); }
.palco.abrindo .interior { opacity: 1; transition: opacity .2s ease; }
.palco.abrindo .cena-svg { animation: entra .7s .85s cubic-bezier(.6,0,.4,1) forwards; transform-origin: 46% 82%; }
@keyframes entra { to { transform: scale(3.2); opacity: 0; } }

.folha-senha { position: relative; flex: 1; margin-top: -22px; background: var(--superficie); border-radius: 26px 26px 0 0;
  padding: 28px 20px calc(28px + env(safe-area-inset-bottom, 0px)); box-shadow: 0 -8px 30px rgba(11,59,65,.10); }
.saudacao { font-family: var(--fonte-titulo); font-size: var(--t5); font-weight: 800; letter-spacing: -.02em; line-height: 1.15; }
.patinhas { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 10px; }
.patinhas span { color: var(--trilho-2); transition: color .15s ease, transform .15s ease; }
.patinhas span.cheia { color: var(--destaque); transform: scale(1.08); }
.caixa-marcar { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: var(--raio); border: 1.5px solid var(--borda); cursor: pointer; }
.caixa-marcar input { width: 24px; height: 24px; margin: 1px 0 0; accent-color: var(--acao); flex-shrink: 0; }
@media (prefers-reduced-motion: reduce) { .palco *, .palco { animation: none !important; transition: none !important; } }
